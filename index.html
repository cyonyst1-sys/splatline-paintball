<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Splatline Paintball</title>
<style>
  :root { --bg:#0b0f0c; --panel:rgba(14,20,16,.92); --ink:#eef3ee; --muted:#9fb1a3; --blue:#2f7dff; --red:#ff4058; --accent:#ffd23f; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  canvas { display:block; }
  body.playing canvas { cursor:none; }
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.55); padding:16px; }
  .hidden { display:none; }
  .panel { background:var(--panel); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:28px 32px; max-width:440px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  h1 { margin:0 0 4px; font-size:44px; letter-spacing:.06em; font-weight:900;
       background:linear-gradient(90deg,var(--blue),#b06cff 50%,var(--red)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tag { margin:0 0 20px; color:var(--muted); }
  .diff { display:flex; gap:8px; justify-content:center; margin-bottom:18px; }
  .diff button { flex:1; padding:8px 0; border-radius:8px; border:1px solid rgba(255,255,255,.15); background:transparent; color:var(--ink); font:inherit; cursor:pointer; }
  .diff button.on { background:rgba(255,255,255,.12); border-color:var(--accent); color:var(--accent); }
  .play { width:100%; padding:14px; border:0; border-radius:10px; background:var(--accent); color:#1a1a1a; font:inherit; font-weight:800; font-size:18px; cursor:pointer; }
  .play:hover { filter:brightness(1.08); }
  .keys { list-style:none; padding:0; margin:20px 0 0; color:var(--muted); font-size:14px; line-height:1.8; text-align:left; display:grid; grid-template-columns:auto 1fr; gap:0 14px; }
  .keys b { color:var(--ink); font-weight:600; }
  #result { font-size:22px; margin:0 0 18px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="overlay">
  <div class="panel">
    <h1>SPLATLINE</h1>
    <p class="tag">4v4 paintball in your browser. One hit and you're out.<br>First team to win 3 rounds takes the match.</p>
    <p id="result" class="hidden"></p>
    <div class="diff" id="diff">
      <button data-d="easy">Easy</button>
      <button data-d="normal" class="on">Normal</button>
      <button data-d="hard">Hard</button>
    </div>
    <button class="play" id="play">Play</button>
    <ul class="keys">
      <li><b>WASD</b></li><li>Move</li>
      <li><b>Mouse</b></li><li>Aim · click/hold to shoot</li>
      <li><b>Shift</b></li><li>Sprint (worse accuracy)</li>
      <li><b>R</b></li><li>Reload hopper</li>
      <li><b>P / Esc</b></li><li>Pause</li>
    </ul>
  </div>
</div>

<script>
(() => {
'use strict';
// ---------- setup ----------
const W = 1400, H = 860, PR = 14, BALL_R = 4, MAG = 20, BALL_SPEED = 950, BALL_RANGE = 950, WIN_ROUNDS = 3;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const base = document.createElement('canvas'); base.width = W; base.height = H;
const bctx = base.getContext('2d');
let scale = 1, ox = 0, oy = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  scale = Math.min(cv.width / W, cv.height / H);
  ox = (cv.width - W * scale) / 2; oy = (cv.height - H * scale) / 2;
}
addEventListener('resize', resize); resize();

const TEAMS = [
  { name: 'BLUE', color: '#2f7dff', paint: '#3a8dff', dark: '#173c7a', names: ['Ace', 'You', 'Moss', 'Dash'] },
  { name: 'RED',  color: '#ff4058', paint: '#ff3d74', dark: '#7a1d2a', names: ['Viper', 'Rook', 'Blaze', 'Fang'] },
];
const DIFF = {
  easy:   { err: 0.15, react: 0.8,  rate: 0.5,  lead: 0.3, speed: 140 },
  normal: { err: 0.085, react: 0.45, rate: 0.32, lead: 0.65, speed: 160 },
  hard:   { err: 0.045, react: 0.25, rate: 0.22, lead: 0.95, speed: 175 },
};
let diff = 'normal';

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;

// ---------- arena ----------
const walls = [];
const half = [[210,150,40,130],[210,580,40,130],[370,70,130,36],[370,754,130,36],[400,375,50,110],[560,210,36,130],[560,520,36,130]];
const center = [[680,110,40,40],[680,710,40,40],[640,400,120,60]];
for (const [x,y,w,h] of half) { walls.push({x,y,w,h}); walls.push({x:W-x-w,y,w,h}); }
for (const [x,y,w,h] of center) walls.push({x,y,w,h});

// cover spots: just outside each side of every bunker
const cover = [];
for (const w of walls) {
  const o = PR + 6;
  const pts = [[w.x - o, w.y + w.h/2], [w.x + w.w + o, w.y + w.h/2], [w.x + w.w/2, w.y - o], [w.x + w.w/2, w.y + w.h + o]];
  for (const [x,y] of pts) if (x > PR && x < W-PR && y > PR && y < H-PR && !insideWall(x,y,PR)) cover.push({x,y});
}
function insideWall(x, y, pad) { return walls.some(w => x > w.x-pad && x < w.x+w.w+pad && y > w.y-pad && y < w.y+w.h+pad); }

function drawBase() {
  const g = bctx;
  g.fillStyle = '#2d4a2f'; g.fillRect(0,0,W,H);
  // mown stripes
  for (let i = 0; i < W; i += 100) { g.fillStyle = (i/100)%2 ? 'rgba(255,255,255,.025)' : 'rgba(0,0,0,.04)'; g.fillRect(i,0,100,H); }
  // grass speckle
  for (let i = 0; i < 2500; i++) { g.fillStyle = Math.random() < .5 ? 'rgba(20,40,20,.35)' : 'rgba(120,160,100,.12)'; g.fillRect(Math.random()*W, Math.random()*H, 2, 2); }
  // spawn zones + center line
  g.fillStyle = 'rgba(47,125,255,.10)'; g.fillRect(0,0,140,H);
  g.fillStyle = 'rgba(255,64,88,.10)';  g.fillRect(W-140,0,140,H);
  g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 3; g.setLineDash([18,14]);
  g.beginPath(); g.moveTo(W/2,0); g.lineTo(W/2,H); g.stroke(); g.setLineDash([]);
  g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 6; g.strokeRect(3,3,W-6,H-6);
  // inflatable bunkers
  for (const w of walls) {
    g.fillStyle = 'rgba(0,0,0,.28)'; roundRect(g, w.x+5, w.y+7, w.w, w.h, 10); g.fill();
    const grd = g.createLinearGradient(w.x, w.y, w.x + w.w, w.y + w.h);
    grd.addColorStop(0, '#f2f2ea'); grd.addColorStop(1, '#b9bdb0');
    g.fillStyle = grd; roundRect(g, w.x, w.y, w.w, w.h, 10); g.fill();
    g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 2; g.stroke();
    g.fillStyle = 'rgba(255,210,63,.75)';
    if (w.w > w.h) g.fillRect(w.x + 8, w.y + w.h/2 - 3, w.w - 16, 6); else g.fillRect(w.x + w.w/2 - 3, w.y + 8, 6, w.h - 16);
  }
}
function roundRect(g, x, y, w, h, r) { r = Math.min(r, w/2, h/2); g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

function splat(x, y, color, ang = Math.random()*6.283, s = 1) {
  const g = bctx; g.save(); g.fillStyle = color; g.globalAlpha = .88;
  const r = (6 + Math.random()*5) * s;
  const blob = (bx, by, br) => { g.beginPath(); g.arc(bx, by, br, 0, 6.283); g.fill(); };
  blob(x, y, r);
  for (let i = 0; i < 5; i++) { const a = Math.random()*6.283, d = r*rand(.5,1); blob(x+Math.cos(a)*d, y+Math.sin(a)*d, r*.5); }
  for (let i = 0; i < 9; i++) { const a = ang + (Math.random()-.5)*1.7, d = r*rand(.9,2.8); blob(x+Math.cos(a)*d, y+Math.sin(a)*d, r*rand(.1,.32)); }
  g.globalAlpha = .25; g.fillStyle = '#fff'; blob(x - r*.3, y - r*.3, r*.3);
  g.restore();
}

// ---------- geometry ----------
function segRect(x1, y1, x2, y2, r, pad = 0) {
  let tmin = 0, tmax = 1; const dx = x2-x1, dy = y2-y1;
  const lo = [r.x-pad, r.y-pad], hi = [r.x+r.w+pad, r.y+r.h+pad], p = [x1, y1], d = [dx, dy];
  for (let i = 0; i < 2; i++) {
    if (Math.abs(d[i]) < 1e-9) { if (p[i] < lo[i] || p[i] > hi[i]) return -1; }
    else {
      let t1 = (lo[i]-p[i])/d[i], t2 = (hi[i]-p[i])/d[i];
      if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
      tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
      if (tmin > tmax) return -1;
    }
  }
  return tmin;
}
function segCircle(x1, y1, x2, y2, cx, cy, R) {
  const dx = x2-x1, dy = y2-y1, fx = x1-cx, fy = y1-cy;
  const a = dx*dx + dy*dy, b = 2*(fx*dx + fy*dy), c = fx*fx + fy*fy - R*R;
  if (c < 0) return 0;
  const disc = b*b - 4*a*c; if (disc < 0 || a === 0) return -1;
  const t = (-b - Math.sqrt(disc)) / (2*a);
  return t >= 0 && t <= 1 ? t : -1;
}
function clearLine(ax, ay, bx, by, pad = 0) { for (const w of walls) if (segRect(ax, ay, bx, by, w, pad) >= 0) return false; return true; }

function collide(p) {
  p.x = clamp(p.x, PR, W-PR); p.y = clamp(p.y, PR, H-PR);
  for (const w of walls) {
    const cx = clamp(p.x, w.x, w.x+w.w), cy = clamp(p.y, w.y, w.y+w.h);
    const dx = p.x-cx, dy = p.y-cy, d2 = dx*dx + dy*dy;
    if (d2 >= PR*PR) continue;
    if (d2 > 1e-4) { const d = Math.sqrt(d2); p.x = cx + dx/d*PR; p.y = cy + dy/d*PR; }
    else { // centre inside the box: push out along the shortest axis
      const l = p.x-w.x, r = w.x+w.w-p.x, t = p.y-w.y, b = w.y+w.h-p.y, m = Math.min(l,r,t,b);
      if (m === l) p.x = w.x-PR; else if (m === r) p.x = w.x+w.w+PR; else if (m === t) p.y = w.y-PR; else p.y = w.y+w.h+PR;
    }
  }
}
function moveEnt(p, dx, dy) { p.x += dx; collide(p); p.y += dy; collide(p); }

// ---------- audio ----------
let ac = null;
function initAudio() { if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} if (ac && ac.state === 'suspended') ac.resume(); }
function noise(dur, freq, vol, q = 1) {
  if (!ac || vol < .005) return;
  const n = Math.max(1, ac.sampleRate*dur | 0), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * (1-i/n) ** 2;
  const s = ac.createBufferSource(); s.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const gn = ac.createGain(); gn.gain.value = vol;
  s.connect(f).connect(gn).connect(ac.destination); s.start();
}
function volAt(x, y) { const h = human(); if (!h) return .3; const d = Math.hypot(x-h.x, y-h.y); return clamp(1 - d/1300, .08, 1); }

// ---------- state ----------
let players = [], balls = [], feed = [], score = [0, 0], round = 1;
let state = 'menu', prevState = 'playing', timer = 0, banner = '', hitMarker = 0, lastWinner = -1;
const keys = {}; let mouse = { x: W/2, y: H/2, down: false };

const human = () => players.find(p => p.human);

function makePlayers() {
  players = [];
  for (let team = 0; team < 2; team++) for (let i = 0; i < 4; i++) {
    players.push({ team, i, human: team === 0 && i === 1, name: TEAMS[team].names[i],
      x: 0, y: 0, ang: 0, alive: true, ammo: MAG, reload: 0, cd: 0, kills: 0,
      goal: null, goalT: 0, seen: 0, target: null, strafe: 1, strafeT: 0, stuckT: 0, lx: 0, ly: 0, avoid: 1, hold: false });
  }
}
function startRound() {
  drawBase();
  for (const p of players) {
    p.x = p.team ? W-70 : 70; p.y = 290 + p.i*95; p.ang = p.team ? Math.PI : 0;
    p.alive = true; p.ammo = MAG; p.reload = 0; p.cd = 0; p.goal = null; p.seen = 0; p.target = null; p.stuckT = 0;
    p.lx = p.x; p.ly = p.y; p.hold = Math.random() < .5;
  }
  balls = []; feed = [];
  state = 'countdown'; timer = 3;
}
function startMatch() {
  score = [0, 0]; round = 1; makePlayers(); startRound();
  document.getElementById('menu').classList.add('hidden');
  document.body.classList.add('playing');
}

// ---------- shooting ----------
function fire(p, ang) {
  if (p.ammo <= 0 || p.reload > 0) return;
  p.ammo--;
  const mx = p.x + Math.cos(ang)*(PR+4), my = p.y + Math.sin(ang)*(PR+4);
  balls.push({ x: mx, y: my, vx: Math.cos(ang)*BALL_SPEED, vy: Math.sin(ang)*BALL_SPEED, d: 0, team: p.team, owner: p, trail: [] });
  noise(.05, 1600, .22 * volAt(p.x, p.y), .8);
  if (p.ammo === 0) startReload(p);
}
function startReload(p) { if (p.reload <= 0 && p.ammo < MAG) p.reload = 1.5; }

function updateBalls(dt) {
  for (let k = balls.length - 1; k >= 0; k--) {
    const b = balls[k];
    const nx = b.x + b.vx*dt, ny = b.y + b.vy*dt;
    let tHit = 2, hitP = null, hitWall = false;
    for (const w of walls) { const t = segRect(b.x, b.y, nx, ny, w, BALL_R*.5); if (t >= 0 && t < tHit) { tHit = t; hitWall = true; } }
    for (const p of players) {
      if (!p.alive || p.team === b.team || state !== 'playing') continue;   // no tags after the round is decided
      const t = segCircle(b.x, b.y, nx, ny, p.x, p.y, PR + BALL_R);
      if (t >= 0 && t < tHit) { tHit = t; hitP = p; hitWall = false; }
    }
    const ang = Math.atan2(b.vy, b.vx), col = TEAMS[b.team].paint;
    b.trail.push(b.x, b.y); if (b.trail.length > 8) b.trail.splice(0, 2);
    if (tHit <= 1) {
      const hx = b.x + (nx-b.x)*tHit, hy = b.y + (ny-b.y)*tHit;
      if (hitP) eliminate(hitP, b.owner, hx, hy, ang);
      else { splat(hx, hy, col, ang + Math.PI, .9); noise(.08, 500, .3 * volAt(hx, hy), 1.5); }
      balls.splice(k, 1); continue;
    }
    b.x = nx; b.y = ny; b.d += BALL_SPEED*dt;
    if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) { splat(clamp(b.x,2,W-2), clamp(b.y,2,H-2), col, ang + Math.PI, .9); balls.splice(k, 1); continue; }
    if (b.d > BALL_RANGE) { splat(b.x, b.y, col, ang, .7); balls.splice(k, 1); }
  }
}
function eliminate(p, by, hx, hy, ang) {
  p.alive = false; p.reload = 0;
  splat(hx, hy, TEAMS[by.team].paint, ang, 1.4);
  noise(.14, 380, .55 * volAt(hx, hy), 1.2);
  by.kills++;
  if (by.human) hitMarker = .25;
  feed.unshift({ a: by.name, at: by.team, b: p.name, bt: p.team, t: 4 }); if (feed.length > 5) feed.pop();
}

// ---------- human ----------
function updateHuman(p, dt) {
  const ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const iy = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  const sprint = keys.ShiftLeft || keys.ShiftRight;
  const len = Math.hypot(ix, iy), moving = len > 0;
  const sp = sprint ? 270 : 185;
  if (moving) moveEnt(p, ix/len*sp*dt, iy/len*sp*dt);
  p.ang = Math.atan2(mouse.y - p.y, mouse.x - p.x);
  if (keys.KeyR) startReload(p);
  if (mouse.down && p.cd <= 0 && p.reload <= 0 && p.ammo > 0) {
    const spread = .03 + (moving ? .035 : 0) + (sprint && moving ? .09 : 0);
    fire(p, p.ang + gauss()*spread); p.cd = .12;
  }
}

// ---------- bots ----------
function pickGoal(b, foes) {
  let best = null, bestS = -1e9;
  const near = foes.length ? foes.reduce((a, f) => Math.hypot(f.x-b.x, f.y-b.y) < Math.hypot(a.x-b.x, a.y-b.y) ? f : a) : null;
  for (const c of cover) {
    if (players.some(o => o !== b && o.alive && o.goal && Math.hypot(o.goal.x-c.x, o.goal.y-c.y) < 30)) continue;
    let s = Math.random()*140 - Math.hypot(c.x-b.x, c.y-b.y)*.25;
    if (near) {
      const d = Math.hypot(near.x-c.x, near.y-c.y);
      s -= Math.abs(d - 340);
      if (!clearLine(c.x, c.y, near.x, near.y)) s += 160;   // hidden from nearest foe
    }
    if (s > bestS) { bestS = s; best = c; }
  }
  b.goal = best ? { x: best.x, y: best.y } : { x: W/2, y: rand(80, H-80) };
  b.goalT = rand(3.5, 7);
}
function steer(b, tx, ty, speed, dt) {
  let a = Math.atan2(ty-b.y, tx-b.x);
  const probe = 36;
  const offs = [0, .6*b.avoid, -.6*b.avoid, 1.2*b.avoid, -1.2*b.avoid, 1.8*b.avoid, -1.8*b.avoid];
  for (const o of offs) {
    const aa = a + o;
    if (clearLine(b.x, b.y, b.x + Math.cos(aa)*probe, b.y + Math.sin(aa)*probe, PR-2)) { a = aa; break; }
  }
  moveEnt(b, Math.cos(a)*speed*dt, Math.sin(a)*speed*dt);
}
function updateBot(b, dt) {
  const D = DIFF[diff];
  const foes = players.filter(p => p.alive && p.team !== b.team);
  if (!foes.length) return;
  let tgt = null, td = 1e9;
  for (const f of foes) {
    const d = Math.hypot(f.x-b.x, f.y-b.y);
    if (d < 780 && d < td && clearLine(b.x, b.y, f.x, f.y)) { tgt = f; td = d; }
  }
  if (b.ammo < MAG && b.reload <= 0 && (b.ammo === 0 || (!tgt && b.ammo < 8))) startReload(b);

  if (tgt) {
    if (tgt !== b.target) { b.target = tgt; b.seen = 0; }
    b.seen += dt;
    // lead the target
    const t = td / BALL_SPEED;
    const px = tgt.x + (tgt.vx || 0)*t*D.lead, py = tgt.y + (tgt.vy || 0)*t*D.lead;
    const want = Math.atan2(py-b.y, px-b.x);
    let da = want - b.ang; da = Math.atan2(Math.sin(da), Math.cos(da));
    b.ang += da * Math.min(1, dt*10);
    if (b.seen > D.react && b.cd <= 0 && b.reload <= 0 && Math.abs(da) < .25) {
      fire(b, b.ang + gauss()*D.err); b.cd = D.rate * rand(.8, 1.4);
    }
    // movement while engaged
    b.strafeT -= dt; if (b.strafeT <= 0) { b.strafe = -b.strafe; b.strafeT = rand(.5, 1.4); }
    const perp = want + Math.PI/2 * b.strafe;
    let sx = Math.cos(perp), sy = Math.sin(perp);
    if (td < 230) { sx -= Math.cos(want)*.8; sy -= Math.sin(want)*.8; }
    const sp = b.reload > 0 ? D.speed : b.hold ? D.speed*.45 : D.speed*.8;
    if (b.reload > 0 && b.goal) steer(b, b.goal.x, b.goal.y, sp, dt);   // duck back to cover to reload
    else moveEnt(b, sx*sp*dt, sy*sp*dt);
  } else {
    b.target = null; b.seen = Math.max(0, b.seen - dt);
    b.goalT -= dt;
    if (!b.goal || b.goalT <= 0 || Math.hypot(b.goal.x-b.x, b.goal.y-b.y) < 10) {
      if (!b.goal || b.goalT <= 0 || Math.random() < dt*1.2) pickGoal(b, foes);
    }
    const near = foes.reduce((a, f) => Math.hypot(f.x-b.x, f.y-b.y) < Math.hypot(a.x-b.x, a.y-b.y) ? f : a);
    const d = Math.hypot(b.goal.x-b.x, b.goal.y-b.y);
    if (d > 8) { steer(b, b.goal.x, b.goal.y, D.speed, dt); b.ang = Math.atan2(b.goal.y-b.y, b.goal.x-b.x) * .3 + b.ang * .7; }
    // look toward nearest foe when parked
    if (d <= 8) { const want = Math.atan2(near.y-b.y, near.x-b.x); let da = want-b.ang; da = Math.atan2(Math.sin(da), Math.cos(da)); b.ang += da*Math.min(1, dt*4); }
    // stuck detection
    b.stuckT += dt;
    if (b.stuckT > .8) {
      if (d > 20 && Math.hypot(b.x-b.lx, b.y-b.ly) < 12) { b.avoid = -b.avoid; pickGoal(b, foes); }
      b.stuckT = 0; b.lx = b.x; b.ly = b.y;
    }
  }
}

// ---------- loop ----------
function update(dt) {
  for (const f of feed) f.t -= dt; feed = feed.filter(f => f.t > 0);
  hitMarker = Math.max(0, hitMarker - dt);
  if (state === 'countdown') { timer -= dt; if (timer <= 0) { state = 'playing'; noise(.25, 900, .3, .5); } return; }
  if (state === 'roundEnd') {
    timer -= dt; updateBalls(dt);
    if (timer <= 0) {
      if (score[0] >= WIN_ROUNDS || score[1] >= WIN_ROUNDS) endMatch(); else { round++; startRound(); }
    }
    return;
  }
  if (state !== 'playing') return;
  for (const p of players) {
    if (!p.alive) continue;
    const px = p.x, py = p.y;
    p.cd -= dt;
    if (p.reload > 0) { p.reload -= dt; if (p.reload <= 0) { p.reload = 0; p.ammo = MAG; } }
    if (p.human) updateHuman(p, dt); else updateBot(p, dt);
    p.vx = (p.x - px) / dt; p.vy = (p.y - py) / dt;
  }
  // soft separation between players
  const alive = players.filter(p => p.alive);
  for (let i = 0; i < alive.length; i++) for (let j = i+1; j < alive.length; j++) {
    const a = alive[i], b = alive[j], dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx, dy);
    if (d > 0 && d < PR*2) { const o = (PR*2 - d)/2; moveEnt(a, -dx/d*o, -dy/d*o); moveEnt(b, dx/d*o, dy/d*o); }
  }
  updateBalls(dt);
  const left = [0, 1].map(t => players.filter(p => p.alive && p.team === t).length);
  if (!left[0] || !left[1]) {
    lastWinner = left[0] ? 0 : 1; score[lastWinner]++;
    banner = `${TEAMS[lastWinner].name} TAKES ROUND ${round}`;
    state = 'roundEnd'; timer = 2.8;
  }
}
function endMatch() {
  state = 'menu';
  document.body.classList.remove('playing');
  const won = score[0] > score[1], h = human();
  const r = document.getElementById('result');
  r.classList.remove('hidden');
  r.innerHTML = `${won ? '🏆 Victory!' : '💥 Defeat'} &nbsp;<b style="color:var(--blue)">${score[0]}</b> – <b style="color:var(--red)">${score[1]}</b><br><small style="color:var(--muted)">You tagged ${h ? h.kills : 0} opponent${h && h.kills === 1 ? '' : 's'}</small>`;
  document.getElementById('play').textContent = 'Play again';
  document.getElementById('menu').classList.remove('hidden');
}

// ---------- render ----------
function render() {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#0b0f0c'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  ctx.drawImage(base, 0, 0);
  if (!players.length) return;

  // balls
  for (const b of balls) {
    ctx.strokeStyle = TEAMS[b.team].paint; ctx.globalAlpha = .35; ctx.lineWidth = 3; ctx.beginPath();
    for (let i = 0; i < b.trail.length; i += 2) i ? ctx.lineTo(b.trail[i], b.trail[i+1]) : ctx.moveTo(b.trail[i], b.trail[i+1]);
    ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillStyle = TEAMS[b.team].paint; ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(b.x-1.2, b.y-1.2, 1.3, 0, 6.283); ctx.fill();
  }
  // players (dead underneath)
  const order = [...players].sort((a, b) => a.alive - b.alive);
  for (const p of order) drawPlayer(p);

  // HUD
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,.45)'; roundRect(ctx, W/2-150, 10, 300, 46, 12); ctx.fill();
  ctx.font = '800 26px system-ui,sans-serif';
  ctx.fillStyle = TEAMS[0].color; ctx.fillText(score[0], W/2-40, 34);
  ctx.fillStyle = TEAMS[1].color; ctx.fillText(score[1], W/2+40, 34);
  ctx.fillStyle = '#ccd'; ctx.font = '600 12px system-ui,sans-serif'; ctx.fillText(`ROUND ${round}`, W/2, 34);
  for (let t = 0; t < 2; t++) {
    const tp = players.filter(p => p.team === t);
    tp.forEach((p, i) => {
      const x = t ? W/2 + 80 + i*15 : W/2 - 80 - i*15;
      ctx.fillStyle = p.alive ? TEAMS[t].color : 'rgba(255,255,255,.18)';
      ctx.beginPath(); ctx.arc(x, 34, 5, 0, 6.283); ctx.fill();
    });
  }
  // kill feed
  ctx.textAlign = 'right'; ctx.font = '600 14px system-ui,sans-serif';
  feed.forEach((f, i) => {
    const y = 26 + i*24; ctx.globalAlpha = Math.min(1, f.t);
    ctx.fillStyle = 'rgba(0,0,0,.45)'; roundRect(ctx, W-232, y-11, 220, 22, 6); ctx.fill();
    ctx.fillStyle = TEAMS[f.bt].color; ctx.fillText(f.b, W-20, y);
    const bw = ctx.measureText(f.b).width;
    ctx.fillStyle = '#ffd23f'; ctx.fillText('◉', W-26-bw, y);
    ctx.fillStyle = TEAMS[f.at].color; ctx.fillText(f.a, W-46-bw, y);
    ctx.globalAlpha = 1;
  });
  // ammo
  const h = human();
  if (h) {
    ctx.fillStyle = 'rgba(0,0,0,.45)'; roundRect(ctx, 14, H-58, 236, 44, 10); ctx.fill();
    ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = '800 20px system-ui,sans-serif';
    ctx.fillText(h.reload > 0 ? 'RELOADING' : `${h.ammo}`, 26, H-36);
    if (h.reload > 0) {
      ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(140, H-40, 96, 8);
      ctx.fillStyle = '#ffd23f'; ctx.fillRect(140, H-40, 96*(1 - h.reload/1.5), 8);
    } else {
      for (let i = 0; i < MAG; i++) { ctx.fillStyle = i < h.ammo ? TEAMS[0].paint : 'rgba(255,255,255,.15)'; ctx.beginPath(); ctx.arc(76 + (i%10)*16, H-44 + (i/10|0)*14, 5, 0, 6.283); ctx.fill(); }
    }
  }
  // banners
  ctx.textAlign = 'center';
  if (state === 'countdown') bigText(Math.ceil(timer) > 0 ? `ROUND ${round} · ${Math.ceil(timer)}` : 'GO!', '#fff');
  else if (state === 'roundEnd') bigText(banner, TEAMS[lastWinner].color);
  else if (state === 'paused') bigText('PAUSED — press P', '#fff');
  else if (state === 'playing' && h && !h.alive) { ctx.font = '700 20px system-ui,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillText("You're out — spectating your team", W/2, H-36); }

  // crosshair
  if ((state === 'playing' || state === 'countdown') && h && h.alive) {
    const { x, y } = mouse, s = 10 + (h.cd > 0 ? 3 : 0);
    ctx.strokeStyle = hitMarker > 0 ? '#ffd23f' : '#fff'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x-s, y); ctx.lineTo(x-4, y); ctx.moveTo(x+4, y); ctx.lineTo(x+s, y);
    ctx.moveTo(x, y-s); ctx.lineTo(x, y-4); ctx.moveTo(x, y+4); ctx.lineTo(x, y+s);
    if (hitMarker > 0) { const m = 8; ctx.moveTo(x-m, y-m); ctx.lineTo(x-3, y-3); ctx.moveTo(x+m, y-m); ctx.lineTo(x+3, y-3); ctx.moveTo(x-m, y+m); ctx.lineTo(x-3, y+3); ctx.moveTo(x+m, y+m); ctx.lineTo(x+3, y+3); }
    ctx.stroke();
  }
}
function bigText(t, col) {
  ctx.font = '900 54px system-ui,sans-serif';
  ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(t, W/2, H/2 - 140);
  ctx.fillStyle = col; ctx.fillText(t, W/2, H/2 - 140);
}
function drawPlayer(p) {
  const T = TEAMS[p.team];
  ctx.save(); ctx.translate(p.x, p.y);
  if (!p.alive) {
    ctx.globalAlpha = .55;
    ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(0, 0, PR, 0, 6.283); ctx.fill();
    ctx.strokeStyle = T.color; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-5,-5); ctx.lineTo(5,5); ctx.moveTo(5,-5); ctx.lineTo(-5,5); ctx.stroke();
    ctx.restore(); return;
  }
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(3, 5, PR, PR*.85, 0, 0, 6.283); ctx.fill();
  ctx.rotate(p.ang);
  ctx.fillStyle = '#222'; ctx.fillRect(PR-6, -3, 16, 6);                  // marker barrel
  ctx.fillStyle = T.paint; ctx.beginPath(); ctx.arc(2, -8, 4, 0, 6.283); ctx.fill(); // hopper
  ctx.rotate(-p.ang);
  ctx.fillStyle = T.color; ctx.beginPath(); ctx.arc(0, 0, PR, 0, 6.283); ctx.fill();
  ctx.strokeStyle = p.human ? '#fff' : T.dark; ctx.lineWidth = p.human ? 3 : 2; ctx.stroke();
  ctx.rotate(p.ang); ctx.fillStyle = 'rgba(20,20,30,.85)'; ctx.fillRect(3, -6, 6, 12); ctx.rotate(-p.ang); // goggles
  if (p.reload > 0) { ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, PR+5, -Math.PI/2, -Math.PI/2 + 6.283*(1 - p.reload/1.5)); ctx.stroke(); }
  ctx.fillStyle = p.human ? '#fff' : 'rgba(255,255,255,.7)'; ctx.font = `${p.human ? 800 : 600} 11px system-ui,sans-serif`; ctx.textAlign = 'center';
  ctx.fillText(p.human ? 'YOU' : p.name, 0, -PR-10);
  ctx.restore();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
drawBase(); requestAnimationFrame(frame);

// ---------- input ----------
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyP' || e.code === 'Escape') {
    if (state === 'paused') { state = prevState; document.body.classList.add('playing'); }
    else if (state === 'playing' || state === 'countdown') { prevState = state; state = 'paused'; document.body.classList.remove('playing'); }
  }
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; if (state === 'playing') { prevState = state; state = 'paused'; document.body.classList.remove('playing'); } });
cv.addEventListener('mousemove', e => {
  const dpr = window.devicePixelRatio || 1;
  mouse.x = clamp((e.clientX*dpr - ox) / scale, 0, W); mouse.y = clamp((e.clientY*dpr - oy) / scale, 0, H);
});
cv.addEventListener('mousedown', e => { if (e.button === 0) { mouse.down = true; initAudio(); } });
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

document.getElementById('diff').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  diff = b.dataset.d;
  for (const x of document.querySelectorAll('#diff button')) x.classList.toggle('on', x === b);
});
document.getElementById('play').addEventListener('click', () => { initAudio(); startMatch(); });
})();
</script>
</body>
</html>
